<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Z Playground</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --border: #e2e1dc;
    --accent: #3b5bdb; --accent-text: #ffffff; --prompt: #8a8a84; --error: #c92a2a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #9a9993; --border: #34342f;
      --accent: #748ffc; --accent-text: #10121a; --prompt: #7d7c76; --error: #ff8787;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; }
  h1 span { color: var(--muted); font-weight: 400; }
  .note { color: var(--muted); font-size: 13px; margin: 0; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
  label { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  select, input[type=number], textarea {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px;
  }
  select { max-width: 100%; }
  input[type=number] { width: 80px; }
  input[type=range] { width: 120px; accent-color: var(--accent); }
  output { font-variant-numeric: tabular-nums; min-width: 3ch; color: var(--text); }
  #model-info { font-size: 13px; color: var(--muted); margin-top: 8px; }
  textarea {
    width: 100%; min-height: 96px; resize: vertical; margin-top: 16px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 14px;
  }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  button {
    font: inherit; font-size: 14px; border-radius: 6px; padding: 7px 14px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button:disabled { opacity: 0.45; cursor: default; }
  kbd { font-size: 12px; color: var(--muted); }
  #output {
    margin-top: 16px; min-height: 160px; white-space: pre-wrap; word-wrap: break-word;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 14px; line-height: 1.6;
  }
  #output .prompt { color: var(--prompt); }
  .placeholder { color: var(--muted); font-family: system-ui, sans-serif; }
  .notice {
    font-family: system-ui, sans-serif; border: 1px dashed var(--accent); border-radius: 8px;
    padding: 14px 16px; line-height: 1.6;
  }
  .notice strong { display: block; margin-bottom: 4px; }
  .notice code {
    display: block; margin: 8px 0; padding: 8px 10px; border-radius: 6px; background: var(--bg);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; white-space: pre-wrap;
  }
  #output.running .gen::after { content: "▍"; color: var(--accent); }
  #stats { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 1.5em; }
  #stats.error { color: var(--error); }
  code { font-size: 13px; }
  /* mode switch */
  .modes { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .modes button { border: 0; border-radius: 0; padding: 6px 14px; background: transparent; }
  .modes button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
  [hidden] { display: none !important; }
  /* chat */
  #chat { display: flex; flex-direction: column; gap: 10px; min-height: 200px; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-text); border-bottom-right-radius: 4px; }
  .msg.z { align-self: flex-start; background: var(--bg); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.z.running::after { content: "▍"; color: var(--accent); }
  .msg .who { display: block; font-size: 12px; opacity: 0.7; margin-bottom: 2px; }
  #chat-input { display: flex; gap: 8px; margin-top: 14px; align-items: flex-end; }
  #message { margin: 0; min-height: 44px; height: 44px; font-family: inherit; font-size: 15px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Z <span>playground</span></h1>
    <p class="note" id="mode-note"></p>
  </header>

  <div class="panel">
    <div class="row">
      <label>Model <select id="model"></select></label>
      <div class="modes" role="group" aria-label="Mode">
        <button id="mode-chat" aria-pressed="false">Chat</button>
        <button id="mode-complete" aria-pressed="true">Complete</button>
      </div>
    </div>
    <div id="model-info"></div>

    <textarea id="prompt" data-mode="complete" spellcheck="false"
              placeholder="Type the beginning of a text, e.g. ROMEO:">ROMEO:</textarea>

    <div class="row" style="margin-top: 12px">
      <label title="Below 1: safer, more repetitive. Above 1: more surprising, more errors. 0: always the most likely token.">
        Temperature <input id="temperature" type="range" min="0" max="2" step="0.05" value="0.8">
        <output id="temperature-v">0.8</output>
      </label>
      <label title="Sample only among the k most likely tokens. 0 = off.">
        Top-k <input id="top_k" type="number" min="0" max="65536" value="50">
      </label>
      <label>
        Length <input id="max_new_tokens" type="range" min="10" max="1000" step="10" value="200">
        <output id="max_new_tokens-v">200</output>
      </label>
      <label title="Same seed + same settings = same text. Empty = random.">
        Seed <input id="seed" type="number" placeholder="random">
      </label>
    </div>

    <div class="buttons">
      <button id="generate" class="primary" data-mode="complete">Generate</button>
      <button id="stop" disabled>Stop</button>
      <button id="continue" data-mode="complete" disabled title="Use the whole output as the next prompt">Continue from output</button>
      <button id="clear-chat" data-mode="chat" disabled>New chat</button>
      <kbd data-mode="complete">Ctrl+Enter to generate</kbd>
    </div>
  </div>

  <div class="panel" style="margin-top: 16px">
    <div id="output" data-mode="complete"><span class="placeholder">The model's continuation appears here, token by token.</span></div>
    <div data-mode="chat">
      <div id="chat"><span class="placeholder" id="chat-empty">Say hello, or ask Z who it is.</span></div>
      <div id="chat-input">
        <textarea id="message" spellcheck="true" placeholder="Message Z (Enter to send, Shift+Enter for a new line)"></textarea>
        <button id="send" class="primary">Send</button>
      </div>
    </div>
    <div id="stats"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let models = [];
let mode = "complete";     // "complete" | "chat"
let controller = null;     // AbortController of the running request, null when idle
let lastFull = "";         // complete mode: prompt + generated text of the last run, for "Continue"
let turns = [];          // chat mode: [{user, z}, ...] sent back with every message
let waitingForModels = false;

const NOTES = {
  complete: "Complete: the model continues your text, like a base model does.",
  chat: "Chat: your message is wrapped as \"User: ...\\nZ:\" and the model replies. " +
        "Works best with a chat fine-tuned model (e.g. chat-tiny); a base model just rambles.",
};

for (const id of ["temperature", "max_new_tokens"]) {
  $(id).addEventListener("input", () => { $(id + "-v").textContent = $(id).value; });
}

// --- models ----------------------------------------------------------------------------

function describe(m) {
  const val = m.best_val != null ? ` · best val loss ${m.best_val.toFixed(3)}` : "";
  return `${m.params.toLocaleString()} parameters · ${m.pos_encoding} positions · ` +
         `context ${m.block_size} tokens · vocab ${m.vocab_size} · ${m.data_dir} · step ${m.step}${val}`;
}

const isChatModel = (m) => /(^|\/)chat/.test(m.data_dir);

async function loadModels() {
  const res = await fetch("/api/models");
  const data = await res.json();
  models = data.models;
  const select = $("model");
  select.innerHTML = "";
  for (const m of models) {
    const opt = document.createElement("option");
    opt.value = m.name;
    opt.textContent = isChatModel(m) ? `${m.name}  (chat)` : m.name;
    select.append(opt);
  }
  if (!models.length) {
    showNoModels(data.checkpoints_dir);
    // Check again every 5 s: the model appears by itself once training saves a checkpoint.
    setTimeout(() => loadModels().catch(() => {}), 5000);
    return;
  }
  if (waitingForModels) {
    waitingForModels = false;
    $("output").replaceChildren(placeholder("The model's continuation appears here, token by token."));
  }
  $("generate").textContent = "Generate";
  modelChanged();
}

function placeholder(text) {
  const span = document.createElement("span");
  span.className = "placeholder";
  span.textContent = text;
  return span;
}

function showNoModels(dir) {
  // Built with textContent, not innerHTML, so the folder name is shown as plain text.
  waitingForModels = true;
  $("model-info").textContent = `No checkpoints in ${dir}/ yet.`;
  $("generate").textContent = "No model loaded";
  setRunning(false);
  const box = document.createElement("div");
  box.className = "notice";
  const title = document.createElement("strong");
  title.textContent = "No trained model yet: train one, and it shows up here by itself.";
  const cmd = document.createElement("code");
  cmd.textContent = "python scripts/train.py --config configs/tiny.yaml";
  const after = document.createElement("span");
  after.textContent = "The first checkpoint is saved after 200 steps (about 2 minutes on a laptop CPU). " +
    "This page checks every few seconds; no need to reload.";
  box.append(title, cmd, after);
  $("output").replaceChildren(box);
}

function current() { return models.find((m) => m.name === $("model").value); }

function modelChanged() {
  const m = current();
  $("model-info").textContent = m ? describe(m) : "";
  // A chat fine-tuned model is meant to be chatted with: switch to chat mode for it.
  if (m && isChatModel(m) !== (mode === "chat")) setMode(isChatModel(m) ? "chat" : "complete");
  setRunning(false);
}
$("model").addEventListener("change", modelChanged);

// --- modes -----------------------------------------------------------------------------

function setMode(next) {
  mode = next;
  for (const el of document.querySelectorAll("[data-mode]")) el.hidden = el.dataset.mode !== mode;
  $("mode-chat").setAttribute("aria-pressed", mode === "chat");
  $("mode-complete").setAttribute("aria-pressed", mode === "complete");
  $("mode-note").textContent = NOTES[mode];
  // Chat replies are short; completions can be long.
  const len = mode === "chat" ? 80 : 200;
  $("max_new_tokens").value = len;
  $("max_new_tokens-v").textContent = len;
  setRunning(false);
}
$("mode-chat").addEventListener("click", () => setMode("chat"));
$("mode-complete").addEventListener("click", () => setMode("complete"));

function setRunning(running) {
  const ready = models.length > 0 && !running;
  $("generate").disabled = !ready;
  $("send").disabled = !ready;
  $("stop").disabled = !running;
  $("continue").disabled = running || !lastFull;
  $("clear-chat").disabled = running || !turns.length;
}

function setStats(message, isError = false) {
  $("stats").textContent = message;
  $("stats").classList.toggle("error", isError);
}

// --- streaming (shared by both modes) ------------------------------------------------------

function settings() {
  return {
    checkpoint: $("model").value,
    temperature: Number($("temperature").value),
    top_k: Number($("top_k").value),
    max_new_tokens: Number($("max_new_tokens").value),
    seed: $("seed").value,
  };
}

// POST to /api/generate and call onText(fullTextSoFar) as pieces arrive.
// Returns the final generated text ("" if it failed or was stopped before anything arrived).
async function stream(body, onText) {
  controller = new AbortController();
  setRunning(true);
  setStats("generating…");
  let generated = "";
  try {
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
      signal: controller.signal,
    });
    if (!res.ok) {
      setStats((await res.json()).error || res.statusText, true);
      return generated;
    }
    // Read the body as it streams in. Chunks don't line up with lines, so keep the
    // unfinished end of each chunk in `buffer` until its newline arrives.
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (!line) continue;
        const msg = JSON.parse(line);
        if (msg.error) setStats(msg.error, true);
        if (msg.text) {
          generated += msg.text;
          // The model began writing the user's next line: keep only what came before it.
          if (msg.cut != null) generated = generated.slice(0, msg.cut);
          onText(generated);
        }
        if (msg.done) setStats(summary(msg));
      }
    }
  } catch (e) {
    if (e.name === "AbortError") setStats("stopped");
    else setStats(`request failed: ${e.message}. Is the server still running?`, true);
  } finally {
    controller = null;
    setRunning(false);
  }
  return generated;
}

function summary(msg) {
  const rate = msg.tokens / msg.seconds;
  const why = { end: "the model ended its reply", length: "length limit reached",
                "user-turn": "stopped where the model began writing your next message" }[msg.stop];
  const cropped = msg.prompt_tokens + msg.tokens > msg.context_limit
    ? ` · the model only sees the last ${msg.context_limit} tokens` : "";
  return `${msg.tokens} tokens in ${msg.seconds.toFixed(1)}s (${rate.toFixed(0)} tokens/s) · ` +
         `${why} · prompt ${msg.prompt_tokens} tokens${cropped}`;
}

$("stop").addEventListener("click", () => controller && controller.abort());

// --- complete mode ---------------------------------------------------------------------------

async function complete() {
  if (controller || !models.length) return;
  const prompt = $("prompt").value;
  // Show the prompt greyed out, followed by the generated text as it arrives.
  const promptSpan = document.createElement("span");
  promptSpan.className = "prompt";
  promptSpan.textContent = prompt;
  const gen = document.createElement("span");
  gen.className = "gen";
  $("output").replaceChildren(promptSpan, gen);
  $("output").classList.add("running");
  const generated = await stream({ ...settings(), mode: "complete", prompt }, (t) => { gen.textContent = t; });
  $("output").classList.remove("running");
  lastFull = prompt + generated;
  setRunning(false);
}

$("generate").addEventListener("click", complete);
$("continue").addEventListener("click", () => { $("prompt").value = lastFull; complete(); });
$("prompt").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); complete(); }
});

// --- chat mode -------------------------------------------------------------------------------

function bubble(who, text) {
  const div = document.createElement("div");
  div.className = `msg ${who}`;
  const label = document.createElement("span");
  label.className = "who";
  label.textContent = who === "user" ? "You" : "Z";
  const body = document.createElement("span");
  body.textContent = text;
  div.append(label, body);
  $("chat-empty").hidden = true;
  $("chat").append(div);
  div.scrollIntoView({ block: "end" });
  return { div, body };
}

async function send() {
  const message = $("message").value.trim();
  if (controller || !models.length || !message) return;
  $("message").value = "";
  bubble("user", message);
  const reply = bubble("z", "");
  reply.div.classList.add("running");
  const generated = await stream(
    { ...settings(), mode: "chat", prompt: message, history: turns },
    (t) => { reply.body.textContent = t.trimStart(); reply.div.scrollIntoView({ block: "end" }); },
  );
  reply.div.classList.remove("running");
  const z = generated.trim();
  if (z) turns.push({ user: message, z });   // a stopped-empty reply isn't remembered
  else reply.body.textContent = "(no reply)";
  setRunning(false);
  $("message").focus();
}

$("send").addEventListener("click", send);
$("message").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("clear-chat").addEventListener("click", () => {
  turns = [];
  $("chat").replaceChildren($("chat-empty"));
  $("chat-empty").hidden = false;
  setStats("");
  setRunning(false);
});

setMode("complete");
loadModels().catch((e) => setStats(`could not load models: ${e.message}`, true));
</script>
</body>
</html>
