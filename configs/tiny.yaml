# Z tiny: ~0.9M parameters. Trains on the laptop CPU in roughly 15-20 minutes.
# Only values that differ from the defaults in zlm/config.py need to be listed,
# but the important ones are spelled out here so the file reads as a full recipe.

model:
  vocab_size: 1024      # = tokenizer size from scripts/prepare_data.py --vocab-size 1024
  block_size: 128
  n_layer: 4
  n_head: 4             # head size 128 / 4 = 32
  n_embd: 128
  dropout: 0.1          # tinyShakespeare is small (~411K tokens): regularize
  pos_encoding: rope    # set to "learned" for the ablation

train:
  batch_size: 32        # 32 x 128 = 4,096 tokens per step
  grad_accum_steps: 1
  max_steps: 2000
  lr: 1e-3
  min_lr: 1e-4
  warmup_steps: 100
  eval_interval: 200
  out_dir: checkpoints/tiny

data:
  data_dir: data/shakespeare

system:
  device: auto
